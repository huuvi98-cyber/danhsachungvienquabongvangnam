    <style>
      :root {
        --bg-canvas: #f7f6f3;
        --ink-primary: #141417;
        --crimson: #c41e28;
        --crimson-bright: #eb2430;
        --gold-bright: #f2ce1b;
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html {
        scroll-behavior: smooth;
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
      }

      body {
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .font-display {
        font-family: 'Barlow Condensed', system-ui, sans-serif;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .text-balance {
        text-wrap: balance;
      }

      /* 3D Flip Card Architecture */
      .flip-card {
        perspective: 1400px;
        cursor: pointer;
        outline: none;
      }

      .flip-card:focus-visible .flip-card-inner {
        box-shadow: 0 0 0 3px #c41e28, 0 12px 28px -8px rgba(20, 20, 23, 0.16);
      }

      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 462px;
        border-radius: 14px;
        transform-style: preserve-3d;
        transition: transform 0.62s var(--ease-out-expo), box-shadow 0.25s ease;
        will-change: transform;
      }

      .flip-card:hover .flip-card-inner {
        box-shadow: 0 18px 36px -14px rgba(20, 20, 23, 0.14);
      }

      .flip-card.is-flipped .flip-card-inner {
        transform: rotateY(180deg);
      }

      @media (hover: hover) and (pointer: fine) {
        .flip-card:hover .flip-card-inner {
          transform: rotateY(180deg);
        }
      }

      .flip-card-face {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
      }

      .flip-card-front {
        background-color: #ffffff;
        border: 1px solid #e5e2db;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .flip-card-back {
        background-color: #b81d27;
        border: 1px solid #99151d;
        color: #ffffff;
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Full-bleed soft light-gray diagonal wedge spanning the bottom edge of card front */
      .card-corner-br {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 54px;
        display: block;
        pointer-events: none;
        z-index: 1;
      }

      /* Upward diagonal cut on portrait stage parallel to .card-corner-br */
      .portrait-stage-clip {
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 46px), 0 100%);
      }

      /* 10-color repeating portrait backdrop palette (5 original + 5 added, top-to-bottom swatch order) */
      .portrait-bg-0 {
        background: linear-gradient(110deg, #e42e2c 0%, #e12d2b 52%, #cf2928 100%);
      }
      .portrait-bg-1 {
        background: linear-gradient(110deg, #fcc13a 0%, #fcbe3a 52%, #f7a238 100%);
      }
      .portrait-bg-2 {
        background: linear-gradient(110deg, #86c04f 0%, #84be4d 52%, #7ab047 100%);
      }
      .portrait-bg-3 {
        background: linear-gradient(110deg, #28a5e3 0%, #28a4e2 52%, #2498d1 100%);
      }
      .portrait-bg-4 {
        background: linear-gradient(110deg, #e42761 0%, #e22660 52%, #d02159 100%);
      }
      .portrait-bg-5 {
        background: linear-gradient(110deg, #259cd6 0%, #29a7e6 52%, #2aaaeb 100%);
      }
      .portrait-bg-6 {
        background: linear-gradient(110deg, #dba251 0%, #eeab4e 52%, #f5b050 100%);
      }
      .portrait-bg-7 {
        background: linear-gradient(110deg, #c010bb 0%, #c810c2 52%, #ca11c3 100%);
      }
      .portrait-bg-8 {
        background: linear-gradient(110deg, #3daf5a 0%, #32b053 52%, #34b254 100%);
      }
      .portrait-bg-9 {
        background: linear-gradient(110deg, #9fa1a2 0%, #b2b3b5 52%, #b9babc 100%);
      }

      /* Subtle custom scrollbar inside card back if achievements overflow on small devices */
      .achievements-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .achievements-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .achievements-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.35);
        border-radius: 999px;
      }

      /* Cover hero subtle elevation */
      .cover-frame {
        box-shadow: 0 24px 60px -24px rgba(20, 20, 23, 0.16);
      }

      /* Cover typography & thin lines moving together toward the soccer ball (ball & ornaments stay still) */
      @keyframes coverDriveToBall {
        0% {
          opacity: 0;
          transform: translateX(-120px);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        16% {
          opacity: 1;
          transform: translateX(0px);
          animation-timing-function: linear;
        }
        74% {
          opacity: 1;
          transform: translateX(24px);
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        88% {
          opacity: 0;
          transform: translateX(88px);
        }
        89%,
        100% {
          opacity: 0;
          transform: translateX(-120px);
        }
      }

      @keyframes coverLineDriveToBall {
        0% {
          opacity: 0;
          stroke-dashoffset: 100;
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        6% {
          opacity: 1;
        }
        18% {
          opacity: 1;
          stroke-dashoffset: 0;
          animation-timing-function: linear;
        }
        74% {
          opacity: 1;
          stroke-dashoffset: 0;
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        88% {
          opacity: 0;
          stroke-dashoffset: -100;
        }
        89%,
        100% {
          opacity: 0;
          stroke-dashoffset: 100;
        }
      }

      .cover-text-line {
        animation: coverDriveToBall 5.4s infinite both;
        will-change: transform, opacity;
      }

      .cover-text-line-1 {
        animation-delay: 0s;
      }
      .cover-text-line-2 {
        animation-delay: 0.12s;
      }
      .cover-text-line-3 {
        animation-delay: 0.24s;
      }
      .cover-text-line-4 {
        animation-delay: 0.36s;
      }

      .cover-track-line {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: coverLineDriveToBall 5.4s infinite both;
      }

      .cover-track-line-1 {
        animation-delay: 0s;
      }
      .cover-track-line-2 {
        animation-delay: 0.12s;
      }
      .cover-track-line-3 {
        animation-delay: 0.24s;
      }
      .cover-track-line-4 {
        animation-delay: 0.36s;
      }

      /* Reduced motion compliance */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .cover-text-line {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .cover-track-line {
          animation: none;
          opacity: 1;
          stroke-dashoffset: 0;
        }
        .flip-card-inner {
          transition: opacity 0.15s ease;
        }
        .flip-card.is-flipped .flip-card-front,
        .flip-card:hover .flip-card-front {
          opacity: 0;
          pointer-events: none;
        }
        .flip-card.is-flipped .flip-card-inner,
        .flip-card:hover .flip-card-inner {
          transform: none;
        }
        .flip-card-back {
          transform: none;
          opacity: 0;
          pointer-events: none;
        }
        .flip-card.is-flipped .flip-card-back,
        .flip-card:hover .flip-card-back {
          opacity: 1;
          pointer-events: auto;
        }
      }
    </style>
  </head>

        const cardsGridEl = document.getElementById('cardsGrid');

        // Helper: Vietnamese accent-insensitive normalization for search
        function normalizeText(str) {
          return str
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd');
        }

        // Helper: Safe HTML escaping
        function escapeHtml(str) {
          const div = document.createElement('div');
          div.textContent = str;
          return div.innerHTML;
        }

        // Helper: Check if an achievement is a major championship or individual top honor
        function isMajorHonor(text) {
          const lower = text.toLowerCase();
          return (
            lower.includes('vô địch') ||
            lower.includes('xuất sắc nhất') ||
            lower.includes('vua phá lưới') ||
            lower.includes('bàn thắng đẹp nhất')
          );
        }

        // Populate club select dropdown
        function populateClubs() {
          const clubCounts = {};
          NOMINEES.forEach((p) => {
            clubCounts[p.club] = (clubCounts[p.club] || 0) + 1;
          });

          const sortedClubs = Object.keys(clubCounts).sort((a, b) => {
            if (clubCounts[b] !== clubCounts[a]) return clubCounts[b] - clubCounts[a];
            return a.localeCompare(b, 'vi');
          });

          sortedClubs.forEach((club) => {
            const option = document.createElement('option');
            option.value = club;
            option.textContent = `${club} (${clubCounts[club]})`;
            clubSelectEl.appendChild(option);
          });
        }

        // Render position segmented tabs
        function renderPositionTabs() {
          positionFiltersEl.innerHTML = POSITIONS.map((pos) => {
            const count =
              pos === 'Tất cả'
                ? NOMINEES.length
                : NOMINEES.filter((p) => p.position === pos).length;
            const isActive = state.position === pos;
            return `
              <button
                type="button"
                role="tab"
                aria-selected="${isActive}"
                data-position="${escapeHtml(pos)}"
                class="px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-colors whitespace-nowrap shrink-0 tabular-nums focus-visible:outline focus-visible:outline-2 focus-visible:outline-crimson ${
                  isActive
                    ? 'bg-white text-ink font-semibold shadow-sm'
                    : 'text-muted hover:text-ink'
                }"
              >
                ${escapeHtml(pos)} <span class="text-muted/80 ml-0.5">(${count})</span>
              </button>
            `;
          }).join('');
        }

        // Get filtered & sorted nominees
        function getFilteredNominees() {
          const q = normalizeText(state.search.trim());

          const list = NOMINEES.filter((player) => {
            if (state.position !== 'Tất cả' && player.position !== state.position) {
              return false;
            }
            if (state.club !== 'all' && player.club !== state.club) {
              return false;
            }
            if (q) {
              const haystack = normalizeText(
                [
                  player.name,
                  player.club,
                  player.position,
                  String(player.birthYear),
                  ...player.achievements,
                ].join(' ')
              );
              return haystack.includes(q);
            }
            return true;
          });

          const sorted = list.slice();
          if (state.sort === 'achievements-desc') {
            sorted.sort((a, b) => b.achievements.length - a.achievements.length || a.id - b.id);
          } else if (state.sort === 'youngest') {
            sorted.sort((a, b) => b.birthYear - a.birthYear || a.id - b.id);
          } else if (state.sort === 'oldest') {
            sorted.sort((a, b) => a.birthYear - b.birthYear || a.id - b.id);
          } else {
            sorted.sort((a, b) => a.id - b.id);
          }
          return sorted;
        }

            .map((item) => {
              const highlight = isMajorHonor(item);

                    ${escapeHtml(item)}
                  </span>

              `;
            })
            .join('');

              role="button"

              aria-pressed="${isFlipped}"

                    <div class="portrait-stage-clip portrait-bg-${paletteIndex} absolute inset-0 pt-2 px-4 pb-2 sm:pt-2.5 sm:px-5 flex items-end justify-center overflow-hidden">
                      <img
                        src="${escapeHtml(player.photo)}"
                        alt="Chân dung ${escapeHtml(player.name)}"
                        referrerpolicy="no-referrer"
                        onerror="this.closest('.portrait-zone').style.display='none'"
                        class="h-full w-auto max-w-full object-contain object-bottom drop-shadow-[0_8px_16px_rgba(20,20,23,0.22)]"
                      />
                    </div>

                        stroke="${diagonalLineColor}"

                        vector-effect="non-scaling-stroke"
                      />
                    </svg>
                  </div>

                  <!-- White Lower Info Body -->
                  <div class="flex-1 flex flex-col justify-start px-6 pt-3 pb-12 sm:px-7 sm:pb-12 relative z-10">

                      <div class="flex items-center gap-2.5">

                        <h2 class="font-display text-[29px] leading-[1.06] font-extrabold text-crimson uppercase tracking-tight">
                          ${escapeHtml(player.name)}

                        </div>
                        <div class="flex items-baseline justify-between gap-4">
                          <dt class="text-xs text-muted shrink-0">Câu lạc bộ</dt>
                          <dd class="font-semibold text-ink text-right truncate" title="${escapeHtml(
                            player.club
                          )}">${escapeHtml(player.club)}</dd>
                        </div>
                      </dl>
                    </div>
                  </div>
                      `
                      : `
                  <div class="flex-1 flex flex-col justify-center px-6 pt-5 pb-12 sm:px-7 sm:pt-6 sm:pb-12 relative z-10">
                    <!-- Centerpiece: Number Badge + Uppercase Crimson Player Name + Metadata -->
                    <div class="py-4">
                      <div class="flex items-center gap-3">
                        <span
                          class="inline-flex items-center justify-center min-w-[38px] h-[38px] px-2 rounded-md bg-crimson text-white font-display text-[24px] leading-none font-extrabold tabular-nums shrink-0"
                        >
                          ${indexStr}
                        </span>
                        <h2 class="font-display text-[32px] leading-[1.08] font-extrabold text-crimson uppercase tracking-tight">
                          ${escapeHtml(player.name)}
                        </h2>
                      </div>

                      <!-- Structured Key-Value Metadata Rows (Zero Pills) -->
                      <dl class="mt-5 pt-4 border-t border-[#EEECE6] space-y-2.5 text-sm">
                        <div class="flex items-baseline justify-between gap-4">
                          <dt class="text-xs text-muted shrink-0">Năm sinh</dt>
                          <dd class="font-semibold text-ink tabular-nums text-right">${player.birthYear}</dd>
                        </div>
                        <div class="flex items-baseline justify-between gap-4">
                          <dt class="text-xs text-muted shrink-0">Vị trí</dt>
                          <dd class="font-semibold text-ink text-right">${escapeHtml(player.position)}</dd>
                        </div>
                        <div class="flex items-baseline justify-between gap-4">
                          <dt class="text-xs text-muted shrink-0">Câu lạc bộ</dt>
                          <dd class="font-semibold text-ink text-right truncate" title="${escapeHtml(
                            player.club
                          )}">${escapeHtml(player.club)}</dd>
                        </div>
                      </dl>
                    </div>
                  </div>
                      `
                  }

                  <!-- Full-Bleed Bottom Diagonal Light-Gray Wedge -->
                  <svg
                    class="card-corner-br"
                    viewBox="0 0 400 54"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                  >
                    <polygon points="0,51 400,2 400,10 0,54" fill="#DFE2E8" />
                    <polygon points="0,53 400,9 400,54 0,54" fill="#ECEEF2" />
                  </svg>
                </div>

                <!-- BACK FACE: Red background with white text -->
                <div class="flip-card-face flip-card-back p-6">
                  <!-- Back Header -->
                  <div class="pb-3.5 border-b border-white/25">
                    <h3 class="font-display text-2xl font-extrabold text-white uppercase tracking-tight truncate">
                      ${escapeHtml(player.name)}
                    </h3>
                    <p class="mt-0.5 text-xs text-white/90 tabular-nums truncate">
                      ${escapeHtml(player.position)} · ${player.birthYear} · ${escapeHtml(player.club)}
                    </p>
                  </div>

                  <!-- Achievements List -->
                  <div class="flex-1 overflow-y-auto achievements-scroll py-3.5 pr-1">
                    <p class="text-xs font-semibold text-white/90 tracking-wide mb-2.5">
                      Thành tích nổi bật
                    </p>
                    <ul class="${isDenseList ? 'space-y-1.5' : 'space-y-2.5'}">
                      ${achievementsHtml}
                    </ul>
                  </div>

                  <!-- Back Footer Cue -->
                  <div class="pt-3 border-t border-white/25 flex items-center justify-between text-xs text-white/90">
                    <span>Ứng viên Quả bóng vàng Việt Nam 2026</span>
                    <span class="font-semibold text-white flex items-center gap-1">
                      <span>Mặt trước</span>
                      <span aria-hidden="true">↺</span>
                    </span>
                  </div>
                </div>
              </div>
            </article>
          `;
        }

        // Render Cards Grid
        function renderCards() {
          const visible = getFilteredNominees();
          const hasFilters =
            state.position !== 'Tất cả' || state.club !== 'all' || state.search.trim() !== '';

          resetFiltersRow.classList.toggle('hidden', !hasFilters);

          if (visible.length === 0) {
            cardsGridEl.innerHTML = '';
            emptyStateEl.classList.remove('hidden');
            return;
          }

          emptyStateEl.classList.add('hidden');
          cardsGridEl.innerHTML = visible.map(createCardMarkup).join('');
        }

        // Toggle single card flip state
        function toggleCardById(id, cardEl) {
          if (state.flippedIds.has(id)) {
            state.flippedIds.delete(id);
            cardEl.classList.remove('is-flipped');
            cardEl.setAttribute('aria-pressed', 'false');
          } else {
            state.flippedIds.add(id);
            cardEl.classList.add('is-flipped');
            cardEl.setAttribute('aria-pressed', 'true');
          }
        }

        // Reset all filters
        function resetFilters() {
          state.position = 'Tất cả';
          state.club = 'all';
          state.search = '';
          state.sort = 'default';
          clubSelectEl.value = 'all';
          sortSelectEl.value = 'default';
          searchInputEl.value = '';
          renderPositionTabs();
          renderCards();
        }

        // Event Listeners
        positionFiltersEl.addEventListener('click', function (e) {
          const btn = e.target.closest('button[data-position]');
          if (!btn) return;
          state.position = btn.getAttribute('data-position');
          renderPositionTabs();
          renderCards();
        });

        clubSelectEl.addEventListener('change', function () {
          state.club = clubSelectEl.value;
          renderCards();
        });

        sortSelectEl.addEventListener('change', function () {
          state.sort = sortSelectEl.value;
          renderCards();
        });

        searchInputEl.addEventListener('input', function () {
          state.search = searchInputEl.value;
          renderCards();
        });

        resetFiltersBtn.addEventListener('click', resetFilters);
        emptyResetBtn.addEventListener('click', resetFilters);

        // Card Click & Keyboard Flip Delegation
        cardsGridEl.addEventListener('click', function (e) {
          const cardEl = e.target.closest('.flip-card');
          if (!cardEl) return;
          const id = Number(cardEl.getAttribute('data-id'));
          toggleCardById(id, cardEl);
        });

        cardsGridEl.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          const cardEl = e.target.closest('.flip-card');
          if (!cardEl) return;
          e.preventDefault();
          const id = Number(cardEl.getAttribute('data-id'));
          toggleCardById(id, cardEl);
        });

        // Initial Render
        populateClubs();
        renderPositionTabs();
        renderCards();
      });
    </script>
  </body>
</html>
